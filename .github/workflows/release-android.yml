name: Release Zapko to Google Play

# How a release happens (nothing is versioned by hand):
#   1. Push to main touching the game (apps/mobile, packages, this pipeline): the `version` job reads
#      every commit since the last v* tag and bumps semver -
#        "feat!:" / "BREAKING CHANGE"  -> major
#        "feat:"                      -> minor
#        anything else                -> patch   (this repo's commits are not all Conventional Commits)
#      It creates the vX.Y.Z tag + GitHub Release, and the build ships that version to the
#      INTERNAL track.
#   2. A manually pushed v*.*.* tag (also how the very first 1.0.0 is cut): builds exactly that version.
#      Tags made by the version job use GITHUB_TOKEN, which GitHub deliberately does not re-trigger
#      workflows for - so there are no double builds.
#   3. workflow_dispatch: rebuild the newest v* tag and publish it to the chosen track
#      (internal / alpha / beta / production), optionally as a staged production rollout.
#
# versionName = the semver above. versionCode = GITHUB_RUN_NUMBER (strictly increasing, which Play
# requires). Both are also written to apps/mobile/build_info.json so the app can show "v1.2.3 (87)"
# on its menu (apps/mobile/scripts/game/app_version.gd).
on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/android/**"
      - ".github/workflows/release-android.yml"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      rollout:
        description: "Production only: fraction of users to roll out to (1 = everyone, 0.1 = 10%)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

# One release at a time: versionCode comes from the run number, and two parallel publishes to the
# same track would race.
concurrency:
  group: release-android
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2-stable"
  # Match Godot 4.7.2's bundled android/build/config.gradle; targetSdk is set in export_presets.tpl.cfg.
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK_VERSION: "29.0.14206865"
  PACKAGE_NAME: "com.ovnicode.gamestudio.zapko"
  EXPORT_PRESET: "release"
  PROJECT_DIR: apps/mobile

jobs:
  # Rules engine (TypeScript) + GDScript port, the same gate as local `pnpm conformance`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-editor-${{ env.GODOT_VERSION }}

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          curl -fLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: GDScript engine vs shared scenarios
        run: GODOT="$HOME/godot/godot" pnpm conformance:godot

  version:
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bump is computed from every commit since the last tag.
          fetch-depth: 0

      - name: Compute the next semver from the commits since the last tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          # Repo has no tag yet -> the first automatic release would be 0.0.1; cut v1.0.0 by hand first.
          initial_version: "1.0.0"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

  build-and-publish:
    needs: [test, version]
    # !failure() && !cancelled() (not success()) lets this run when `version` was skipped (tag push, dispatch).
    if: >-
      !failure() && !cancelled() && (
        github.ref_type == 'tag' ||
        github.event_name == 'workflow_dispatch' ||
        needs.version.outputs.new_tag != ''
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to find the latest tag on manual dispatch

      - name: Resolve the version
        id: ver
        env:
          AUTO_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          # Precedence: pushed tag > semver bumped by the version job > newest existing tag (dispatch).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "${AUTO_VERSION}" ]; then
            VERSION_NAME="${AUTO_VERSION}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              echo "::error::No v*.*.* tag exists yet. Push v1.0.0 first (git tag v1.0.0 && git push origin v1.0.0)."
              exit 1
            fi
            VERSION_NAME="${latest#v}"
          fi
          if ! echo "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION_NAME' is not a plain x.y.z version"
            exit 1
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION_NAME} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Stamp build_info.json (what the in-game version label reads)
        run: |
          printf '{"version":"%s","build":%s,"commit":"%s"}\n' \
            "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}" "${GITHUB_SHA::7}" \
            > "${PROJECT_DIR}/build_info.json"
          cat "${PROJECT_DIR}/build_info.json"

      - name: Verify every res:// asset path referenced in code exists
        run: |
          missing=0
          while IFS= read -r path; do
            rel="${PROJECT_DIR}/${path#res://}"
            if [ ! -f "$rel" ]; then
              echo "::error::Referenced asset missing from the repo: ${path} - check .gitignore didn't untrack it."
              missing=$((missing + 1))
            fi
          done < <(grep -rhoE 'res://[A-Za-z0-9_./-]+\.(glb|gltf|png|jpg|jpeg|svg|tscn|tres|ogg|wav|mp3|ttf|json)' \
            --include='*.gd' --include='*.tscn' "${PROJECT_DIR}" | grep -v 'res://build_info.json' | sort -u)
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing res:// path(s) referenced in code have no file in the repo."
            exit 1
          fi
          echo "Every res:// asset path referenced in .gd/.tscn files exists."

      - name: Resolve native debug symbols path
        # upload-google-play reads this with plain Node fs calls, which do not expand "~".
        run: echo "NATIVE_DEBUG_SYMBOLS=$HOME/godot/native_debug_symbols.zip" >> "$GITHUB_ENV"

      - name: Cache Godot editor & export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Download Godot editor & export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          cd ~/godot

          curl -fLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

          curl -fLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          template_dir=~/.local/share/godot/export_templates/"$(echo "$GODOT_VERSION" | sed 's/-/./')"
          mkdir -p "$template_dir"
          unzip -q "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* "$template_dir"/

          # Native debug symbols for the release template's libgodot_android.so; must come from the exact
          # same build as the templates above so Play can match them (clears the "no native debug symbols" warning).
          curl -fLO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_native_debug_symbols.${GODOT_VERSION/-/.}.template_release.android.zip"
          mv "Godot_native_debug_symbols.${GODOT_VERSION/-/.}.template_release.android.zip" native_debug_symbols.zip

      - name: Import project resources
        # Generated here on the runner; nothing comes from a developer machine.
        run: |
          set -o pipefail
          ~/godot/godot --headless --path "${PROJECT_DIR}" --import 2>&1 | tail -n 40
          count=$(find "${PROJECT_DIR}/.godot/imported" -type f 2>/dev/null | wc -l)
          echo "Imported ${count} resource file(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::Godot's headless import produced nothing in .godot/imported."
            exit 1
          fi

      - name: Fail if any tracked asset was not imported
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if [ ! -f "${f}.import" ]; then
              echo "::error file=${f}::No .import sidecar after import - it would ship un-imported."
              missing=$((missing + 1))
            fi
          done < <(find "${PROJECT_DIR}" -not -path "*/.godot/*" -type f \
            \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.svg" -o -iname "*.ogg" -o -iname "*.wav" -o -iname "*.mp3" -o -iname "*.ttf" -o -iname "*.glb" \) -print0)
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing asset(s) were not imported."
            exit 1
          fi
          echo "All assets were imported."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Android gradle build template
        run: |
          template_dir=~/.local/share/godot/export_templates/"$(echo "$GODOT_VERSION" | sed 's/-/./')"
          mkdir -p "${PROJECT_DIR}/android/build"
          unzip -o -q "$template_dir/android_source.zip" -d "${PROJECT_DIR}/android/build"
          echo "$(echo "$GODOT_VERSION" | sed 's/-/./')" > "${PROJECT_DIR}/android/.build_version"

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Generate export_presets.cfg
        # Replaces the committed dev preset (local APK/Windows exports) with the signed release one.
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          command -v envsubst >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base)
          envsubst '${VERSION_CODE} ${VERSION_NAME} ${RELEASE_KEYSTORE_PATH} ${RELEASE_KEY_ALIAS} ${RELEASE_KEY_PASSWORD}' \
            < .github/android/export_presets.tpl.cfg > "${PROJECT_DIR}/export_presets.cfg"

      - name: Tell Godot which JDK and Android SDK to use
        # The runner image ships newer JDKs (25) that Godot's gradle 8.11 cannot run on ("Unsupported class
        # file major version 69"); Godot does not reliably follow JAVA_HOME, so pin it in the editor settings.
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres
          cat ~/.config/godot/editor_settings-4.7.tres
          "${JAVA_HOME}/bin/java" -version

      - name: Export signed AAB
        run: |
          set -o pipefail
          mkdir -p build
          ~/godot/godot --headless --path "${PROJECT_DIR}" --export-release "${EXPORT_PRESET}" "${GITHUB_WORKSPACE}/build/Zapko.aab" 2>&1 | tee export.log
          test -s build/Zapko.aab

          # Godot's headless exporter exits 0 even when something silently went missing; check the bytes.
          if ! unzip -l build/Zapko.aab | grep -q "assets/build_info.json"; then
            echo "::error::build_info.json is not in the AAB - the in-game version label would read 'dev'."
            unzip -l build/Zapko.aab | grep -i "build_info\|main.pck" || true
            exit 1
          fi
          unzip -p build/Zapko.aab "$(unzip -Z1 build/Zapko.aab | grep 'assets/build_info.json')"
          # Imported textures are packaged as compiled .ctex resources; none means the import step was a no-op.
          if ! unzip -Z1 build/Zapko.aab | grep -q '\.ctex$'; then
            echo "::error::No compiled textures in the AAB - resources shipped un-imported."
            exit 1
          fi
          echo "Verified: build_info.json and compiled textures are packaged."

      - name: Prepare release notes
        env:
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          mkdir -p whatsnew
          NOTES="$CHANGELOG"
          if [ -z "$NOTES" ]; then
            NOTES="Update ${{ steps.ver.outputs.name }} - bug fixes and improvements."
          fi
          # Play does not render markdown: strip headers, commit links and bullets.
          NOTES=$(printf '%s' "$NOTES" \
            | sed -E 's/^#+ *//' \
            | sed -E 's/ *\(\[[0-9a-f]+\]\([^()]*\)\)//g' \
            | sed -E 's/\[([^][]+)\]\([^()]*\)/\1/g' \
            | sed -E 's/^\* /- /' \
            | sed -E '/^[[:space:]]*$/d')
          # "What's new" is capped at 500 characters per locale.
          printf '%s' "$NOTES" | head -c 500 > whatsnew/whatsnew-en-US

      - name: Upload build artifact
        # Convenience only (grab the AAB from the Actions UI); a storage-quota failure must not block the release.
        id: upload-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zapko-aab
          path: build/Zapko.aab

      - name: Pick track and rollout
        id: play
        env:
          TRACK: ${{ github.event.inputs.track }}
          ROLLOUT: ${{ github.event.inputs.rollout }}
        run: |
          track="${TRACK:-internal}"
          status=completed
          fraction=""
          if [ "$track" = "production" ] && [ -n "$ROLLOUT" ] && [ "$ROLLOUT" != "1" ]; then
            status=inProgress
            fraction="$ROLLOUT"
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "fraction=$fraction" >> "$GITHUB_OUTPUT"

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/Zapko.aab
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          track: ${{ steps.play.outputs.track }}
          status: ${{ steps.play.outputs.status }}
          userFraction: ${{ steps.play.outputs.fraction }}
          whatsNewDirectory: whatsnew/
          debugSymbols: ${{ env.NATIVE_DEBUG_SYMBOLS }}

      - name: Delete build artifact
        # Once the AAB is on Play the convenience copy only burns storage quota.
        if: steps.upload-artifact.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.upload-artifact.outputs.artifact-id }}"
